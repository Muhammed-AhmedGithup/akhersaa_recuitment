<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      (function() {
        // 1. Suppress benign Vite HMR WebSocket console messages in iframe/Cloud Run
        var origConsoleError = console.error;
        console.error = function() {
          var str = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            str += ' ' + ((arg && (arg.message || arg.stack)) || String(arg || ''));
          }
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('[vite]') !== -1 || str.indexOf('ws://') !== -1 || str.indexOf('wss://') !== -1) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var str = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            str += ' ' + ((arg && (arg.message || arg.stack)) || String(arg || ''));
          }
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('[vite]') !== -1) {
            return;
          }
          return origConsoleWarn.apply(console, arguments);
        };

        // 2. Intercept window error and unhandledrejection
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || String(e || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('[vite]') !== -1 || msg.indexOf('ws://') !== -1 || msg.indexOf('wss://') !== -1) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e ? e.reason : null;
          var msg = (reason && (reason.message || reason.stack)) || String(reason || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('[vite]') !== -1 || msg.indexOf('ws://') !== -1 || msg.indexOf('wss://') !== -1) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);

        // 3. Mock Vite HMR WebSocket so it cleanly resolves without closing
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isViteHmr = false;
            if (protocols === 'vite-hmr' || protocols === 'vite-ping') isViteHmr = true;
            if (Array.isArray(protocols) && (protocols.indexOf('vite-hmr') !== -1 || protocols.indexOf('vite-ping') !== -1)) isViteHmr = true;
            if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('/@vite/') !== -1)) isViteHmr = true;

            if (isViteHmr) {
              var listeners = {};
              var mockSocket = {
                url: url,
                readyState: 1, // WebSocket.OPEN
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                send: function() {},
                close: function() {
                  mockSocket.readyState = 3;
                },
                addEventListener: function(type, listener) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(listener);
                  if (type === 'open') {
                    setTimeout(function() {
                      try { listener({ type: 'open', target: mockSocket }); } catch(err) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, listener) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function(l) { return l !== listener; });
                },
                dispatchEvent: function() { return true; }
              };
              return mockSocket;
            }

            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
      })();
    </script>
